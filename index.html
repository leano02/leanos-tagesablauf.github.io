<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagesplan App</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="app">

  <header>
    <h1>📅 Tagesplan</h1>
    <button onclick="toggleDarkMode()">🌙</button>
  </header>

  <nav>
    <button onclick="showPage('today')">Heute</button>
    <button onclick="showPage('stats')">Statistik</button>
  </nav>

  <!-- HEUTE -->
  <section id="todayPage" class="page">
    <div class="input-box">
      <input id="taskInput" type="text" placeholder="Neue Aufgabe eingeben...">
      <button onclick="addTask()">+</button>
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>
    <p id="progressText">0% erledigt</p>

    <ul id="taskList"></ul>
    <p id="streak">🔥 Streak: 0 Tage</p>
  </section>

  <!-- STATISTIK -->
  <section id="statsPage" class="page hidden">
    <h2>📊 Wochen-Statistik</h2>
    <canvas id="weeklyChart"></canvas>

    <h2>📈 Monats-Statistik</h2>
    <canvas id="monthlyChart"></canvas>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
